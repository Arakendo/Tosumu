        - Conversations: Conversations/README.md
        - Archive: Archive/README.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra_css:
  - overrides/css/extra.css

extra_javascript:
  - overrides/js/tosumu-inspection-island.js

extra:
  generator: false
