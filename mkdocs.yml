site_name: Tosumu
site_description: Experimental local database engine focused on inspectability and explicit failure reporting.
site_url: https://tosumu.org/
repo_url: https://github.com/Arakendo/Tosumu
repo_name: Arakendo/Tosumu

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
  icon:
    logo: material/database

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Labs:
      - Inspection Boundary: labs/inspection-boundary.md
  - Concepts: concepts.md
  - Architecture: architecture.md
  - File Format: file-format.md
  - Error Model: error-model.md
  - Inspect API: inspect-api.md
  - CLI Reference: cli-reference.md
  - Safety and Limits: safety-and-limits.md
  - Roadmap: roadmap.md
  - Development: development.md
  - Tosumu Command Language: Tosumu Command Language.md
  - Specifications:
      - Specifications/README.md
      - Software Design Document: Specifications/Tosumu Software Design Document.md
      - Error Design Document: Specifications/Tosumu Error Design Document.md
      - Inspect API Specification: Specifications/Tosumu Inspect API Specification.md
      - Reference Implementations: Specifications/Tosumu Reference Implementations.md
  - Project Governance:
      - project-governance.md
      - Document Status: document-status.md
      - Architecture Decisions:
          - ADR/README.md
          - ADR-0001 Storage Engine Layer Boundaries: ADR/ADR-0001-storage-engine-layer-boundaries.md
          - ADR-0002 Authenticated Pager Trust Boundary: ADR/ADR-0002-authenticated-pager-trust-boundary.md
          - ADR-0003 Source Unit Cohesion Size Pressure And Decomposition: ADR/ADR-0003-source-unit-cohesion-size-pressure-and-decomposition.md
          - ADR-0004 Cooperative Single-Writer Admission: ADR/ADR-0004-cooperative-single-writer-admission.md
          - ADR-0005 Committed Generation And Retained WAL Snapshots: ADR/ADR-0005-committed-generation-and-retained-wal-snapshots.md
          - ADR-0006 Shared KV Store And Snapshot Transactions: ADR/ADR-0006-shared-kv-store-and-snapshot-transactions.md
          - ADR-0007 Database Generation Conditional Writes: ADR/ADR-0007-database-generation-conditional-writes.md
          - ADR-0008 SQL Owned Secondary Index Keyspaces: ADR/ADR-0008-sql-owned-secondary-index-keyspaces.md
          - ADR-0009 Offline VACUUM Rebuild Publication: ADR/ADR-0009-offline-vacuum-rebuild-publication.md
          - ADR-0010 Private Format-v3 Cryptographic Mechanism Seams: ADR/ADR-0010-private-format-v3-cryptographic-mechanism-seams.md
          - Template: ADR/TEMPLATE.md
      - Architectural Reviews:
          - Architectural Reviews/README.md
          - AR-0001 TQL Command Language Boundary: Architectural Reviews/AR-0001-tql-command-language-boundary.md
          - AR-0002 Structured Inspection Contract Boundary: Architectural Reviews/AR-0002-structured-inspection-contract-boundary.md
          - AR-0003 Service Authority And Host Modes: Architectural Reviews/AR-0003-service-authority-and-host-modes.md
          - AR-0004 Semantic Change History And Sync: Architectural Reviews/AR-0004-semantic-change-history-and-sync.md
          - AR-0005 Witness Observer And Freshness: Architectural Reviews/AR-0005-witness-observer-and-freshness.md
          - AR-0006 Format Evolution And Migration Boundary: Architectural Reviews/AR-0006-format-evolution-and-migration-boundary.md
          - AR-0007 Core Change Evidence And Resilience: Architectural Reviews/AR-0007-core-change-evidence-and-resilience.md
          - AR-0008 Operation Outcome Closure And Crash Evidence: Architectural Reviews/AR-0008-operation-outcome-closure-and-crash-evidence.md
          - AR-0009 Multiple Reader Execution And Coordination: Architectural Reviews/AR-0009-multiple-reader-execution-and-coordination.md
          - AR-0010 Dependency Trust And Source Provenance: Architectural Reviews/AR-0010-dependency-trust-and-source-provenance.md
          - AR-0011 Committed Generation And Version Residence: Architectural Reviews/AR-0011-committed-generation-and-version-residence.md
          - AR-0012 Conditional Write And Version Token Semantics: Architectural Reviews/AR-0012-conditional-write-and-version-token-semantics.md
          - AR-0013 Secondary Index Representation And Ownership: Architectural Reviews/AR-0013-secondary-index-representation-and-ownership.md
          - AR-0014 VACUUM Rebuild And Publication: Architectural Reviews/AR-0014-vacuum-rebuild-and-publication.md
          - AR-0015 Native Replication Scope Authority And Failure Model: Architectural Reviews/AR-0015-native-replication-scope-authority-and-failure-model.md
          - AR-0016 Cryptographic Provider Seam And Suite Identity: Architectural Reviews/AR-0016-cryptographic-provider-seam-and-suite-identity.md
          - AR-0017 Mobile Embedding ABI And Hardware Protector Boundary: Architectural Reviews/AR-0017-mobile-embedding-abi-and-hardware-protector-boundary.md
          - AR-0018 Bounded Snapshot Range Pagination: Architectural Reviews/AR-0018-bounded-snapshot-range-pagination.md
          - AR-0019 Foreign Atomic Mutation Batch Boundary: Architectural Reviews/AR-0019-foreign-atomic-mutation-batch-boundary.md
          - Template: Architectural Reviews/TEMPLATE.md
      - Implementation Plans:
          - Plans/README.md
          - Main Feature Roadmap: Plans/main-feature-roadmap.md
          - MVP+10 Multiple Readers And Coordination: Plans/mvp-10-multiple-readers.md
          - MVP+10 Secondary Indexes: Plans/mvp-10-secondary-indexes.md
          - MVP+10 VACUUM: Plans/mvp-10-vacuum.md
          - MVP+10 Benchmark Closure: Plans/mvp-10-benchmarks.md
          - MVP+11 Mobile Embedding: Plans/mvp-11-mobile-embedding.md
          - Initial SQL Layer: Plans/initial-sql-layer.md
          - Tosumu Command Language: Plans/tosumu-command-language.md
          - Tokimu Reciprocal Website Evidence: Plans/tokimu-reciprocal-website-evidence.md
          - Tosumu Inspection Island And UI Providers: Plans/tosumu-inspection-island-and-ui-providers.md
          - Public Website And Repository Records: Plans/public-website-and-repository-records.md
          - Documentation Lifecycle And Design Decomposition: Plans/documentation-lifecycle-and-design-decomposition.md
          - Core Source Unit Decomposition: Plans/core-source-unit-decomposition.md
          - Cluster Fault Tolerance And Replication: Plans/cluster-fault-tolerance-and-replication.md
          - High-Assurance Engineering And Evidence Export: Plans/high-assurance-engineering-and-evidence-export.md
          - Cryptographic Provider Seam And Suite Agility: Plans/cryptographic-provider-seam-and-suite-agility.md
          - Template: Plans/TEMPLATE.md
      - Change Requests:
          - CRs/README.md
          - Tokimu-001:
              - CRs/Tokimu/README.md
              - Provider Boundary: CRs/Tokimu/tokimu-001-tasset-storage-provider-boundary.md
              - Implementation Plan: CRs/Tokimu/tokimu-001-implementation-plan.md
              - Provider Baseline: CRs/Tokimu/tokimu-001-provider-baseline.md
              - Shared Fixture: CRs/Tokimu/tokimu-001-fixture.md
      - Supporting Records:
        - supporting-records.md
        - Notes:
          - Notes/README.md
          - Architecture Governance Extraction Audit: Notes/architecture-governance-extraction-audit.md
          - Assurance Claim Inventory v1: Notes/assurance-claim-inventory-v1.md
          - Dependency Provenance Baseline v1: Notes/dependency-provenance-baseline-v1.md
          - MVP+11 Foreign Contract And Target Inventory v1: Notes/mvp-11-foreign-contract-and-target-inventory-v1.md
          - MVP+11 Experimental ABI Contract v1: Notes/mvp-11-experimental-abi-contract-v1.md
