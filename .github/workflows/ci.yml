name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - README.md
      - "docs/Specifications/Tosumu Software Design Document.md"
      - "docs/Specifications/Tosumu Error Design Document.md"
      - "docs/Specifications/Tosumu Inspect API Specification.md"
      - SECURITY.md
      - .github/workflows/docs.yml
  pull_request:
    branches: [main]
    paths-ignore:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - README.md
      - "docs/Specifications/Tosumu Software Design Document.md"
      - "docs/Specifications/Tosumu Error Design Document.md"
      - "docs/Specifications/Tosumu Inspect API Specification.md"
      - SECURITY.md
      - .github/workflows/docs.yml

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ffi-miri:
    name: experimental FFI boundary / Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-03
          components: miri
      - name: Prepare Miri sysroot
        run: cargo +nightly-2026-09-03 miri setup
      - name: Interpret unsafe slice, copy, and close-race boundary
        env:
          MIRIFLAGS: -Zmiri-many-seeds=0..8
        run: >-
          cargo +nightly-2026-09-03 miri test
          -p tosumu-ffi-experimental --lib
          interpreter_checks_slice_copy_and_close_race_contract

  experimental-c-abi:
    name: independent experimental C ABI harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Build and run independent C harness
        run: bash tools/ffi-harness/run-linux.sh

  crypto-oracle:
    name: independent format-v3 crypto oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/crypto-oracle/go.mod
          cache-dependency-path: tools/crypto-oracle/go.sum
      - name: Verify independent format-v3 corpus
        working-directory: tools/crypto-oracle
        run: go test ./...

  dependency-provenance:
    name: dependency provenance baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Check retained dependency provenance
        shell: pwsh
        run: pwsh -NoProfile -File scripts/dependency-provenance.ps1 -Check

  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "stable / linux",   os: ubuntu-latest,  toolchain: stable }
          - { name: "stable / windows", os: windows-latest, toolchain: stable }
          - { name: "stable / macos",   os: macos-latest,   toolchain: stable }
          - { name: "beta / linux",     os: ubuntu-latest,  toolchain: beta }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: cargo doc
        run: cargo doc --workspace --no-deps
