name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - README.md
      - "docs/Specifications/Tosumu Software Design Document.md"
      - "docs/Specifications/Tosumu Error Design Document.md"
      - "docs/Specifications/Tosumu Inspect API Specification.md"
      - SECURITY.md
      - .github/workflows/docs.yml
  pull_request:
    branches: [main]
    paths-ignore:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - README.md
      - "docs/Specifications/Tosumu Software Design Document.md"
      - "docs/Specifications/Tosumu Error Design Document.md"
      - "docs/Specifications/Tosumu Inspect API Specification.md"
      - SECURITY.md
      - .github/workflows/docs.yml

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  mobile-ios-artifacts:
    name: experimental iOS ARM64 artifacts
    runs-on: macos-15
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      IPHONEOS_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Select and verify Xcode and SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version | tee target-xcode-version.txt
          grep -Fx "Xcode 16.4" target-xcode-version.txt
          grep -Fx "Build version 16F6" target-xcode-version.txt
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "18.5"
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "18.5"
          rustc -vV
          llvm_nm="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-nm"
          test -x "$llvm_nm"
          "$llvm_nm" --version
      - name: Link and inspect device and simulator archives
        run: |
          llvm_nm="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-nm"
          for target in aarch64-apple-ios aarch64-apple-ios-sim; do
            rustc --target "$target" --print cfg | grep -Fx 'panic="unwind"'
            cargo build --locked --release -p tosumu-ffi-experimental --target "$target"
            archive="target/$target/release/libtosumu_ffi_experimental.a"
            test -f "$archive"
            file "$archive"
            lipo -info "$archive"
            "$llvm_nm" --extern-only --defined-only "$archive" \
              | awk '{print $NF}' \
              | sed 's/^_//' \
              | grep '^tosumu_experimental_v1_' \
              | sort -u > "target/$target/exports.txt"
            diff -u tools/ffi-harness/symbols-production.txt \
              "target/$target/exports.txt"
          done

  mobile-android-artifacts:
    name: experimental Android 64-bit artifacts
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      TOSUMU_ANDROID_NDK: /usr/local/lib/android/sdk/ndk/27.3.13750724
      CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: /usr/local/lib/android/sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
      CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: /usr/local/lib/android/sdk/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Verify NDK and compiler identity
        run: |
          grep -Fx "Pkg.Revision = 27.3.13750724" \
            "$TOSUMU_ANDROID_NDK/source.properties"
          "$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER" --version
          "$CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER" --version
          rustc -vV
      - name: Link and inspect device and emulator shared objects
        run: |
          for target in aarch64-linux-android x86_64-linux-android; do
            rustc --target "$target" --print cfg | grep -Fx 'panic="unwind"'
            cargo build --locked --release -p tosumu-ffi-experimental --target "$target"
            library="target/$target/release/libtosumu_ffi_experimental.so"
            test -f "$library"
            file "$library"
            readelf -h "$library"
            readelf -d "$library"
            nm -D --defined-only "$library" \
              | awk '{print $3}' \
              | grep '^tosumu_experimental_v1_' \
              | sort -u > "target/$target/exports.txt"
            diff -u tools/ffi-harness/symbols-production.txt \
              "target/$target/exports.txt"
          done

  ffi-miri:
    name: experimental FFI boundary / Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-03
          components: miri
      - name: Prepare Miri sysroot
        run: cargo +nightly-2026-09-03 miri setup
      - name: Interpret unsafe slice, copy, and close-race boundary
        env:
          MIRIFLAGS: -Zmiri-many-seeds=0..8
        run: >-
          cargo +nightly-2026-09-03 miri test
          -p tosumu-ffi-experimental --lib
          interpreter_checks_slice_copy_and_close_race_contract

  experimental-c-abi:
    name: independent experimental C ABI harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Build and run independent C harness
        run: bash tools/ffi-harness/run-linux.sh

  crypto-oracle:
    name: independent format-v3 crypto oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/crypto-oracle/go.mod
          cache-dependency-path: tools/crypto-oracle/go.sum
      - name: Verify independent format-v3 corpus
        working-directory: tools/crypto-oracle
        run: go test ./...

  dependency-provenance:
    name: dependency provenance baseline
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Check retained dependency provenance
        shell: pwsh
        run: pwsh -NoProfile -File scripts/dependency-provenance.ps1 -Check

  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "stable / linux",   os: ubuntu-latest,  toolchain: stable }
          - { name: "stable / windows", os: windows-latest, toolchain: stable }
          - { name: "stable / macos",   os: macos-latest,   toolchain: stable }
          - { name: "beta / linux",     os: ubuntu-latest,  toolchain: beta }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: cargo doc
        run: cargo doc --workspace --no-deps
