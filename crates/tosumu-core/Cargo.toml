[package]
name = "tosumu-core"
description = "Core library for the tosumu embedded database (page-based, authenticated-encrypted)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[lints]
workspace = true

[features]
experimental-shared-readers = []

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10.1"
crc32fast = "1.4"
data-encoding = "2"
getrandom = "0.2"
hkdf = "0.12.4"
hmac = "0.12"
sha2 = "0.10.9"
thiserror = "2.0.18"
zeroize = "1.8.2"

[target.'cfg(any(unix, windows))'.dependencies]
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
